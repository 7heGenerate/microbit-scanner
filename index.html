<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Radar</title>
<style>
  html,body{margin:0;height:100%;background:#0b1020;color:#e6e9f2;font-family:system-ui,sans-serif;overflow:hidden}
  #bar{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px;padding:10px;z-index:1}
  button{padding:10px 14px;border:0;border-radius:8px;background:#26335c;color:#fff;font-size:15px}
  canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #status{pointer-events:none;position:fixed;bottom:0;left:0;right:0;padding:10px;font-size:14px}
</style>
</head>
<body>
<div id="bar">
  <button id="connect">Connect radar</button>
  <button id="clear">Clear my map</button>
  <button id="restore">Show all</button>
  <button id="demo">Demo</button>
  <button id="reset">Reset view</button>
</div>
<canvas id="view"></canvas>
<div id="status">Starting...</div>
<script>
  // Plain script: reports problems even if the main code never loads
  (function () {
    var box = document.getElementById('status');
    function show(t) { box.textContent = t; }
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && t.tagName === 'SCRIPT') show('Could not load app.js or a file it imports (view.js, geometry.js). Check names and folder.');
      else if (e.message) show('Error: ' + e.message + ' (' + String(e.filename).split('/').pop() + ':' + e.lineno + ')');
    }, true);
    if (location.protocol === 'file:') show('Open this through your GitHub Pages https link, not as a local file.');
    else setTimeout(function () {
      if (!window.appStarted && box.textContent === 'Starting...')
        show('The app did not start. Check that app.js, view.js and geometry.js are beside index.html.');
    }, 8000);
  })();
</script>
<script type="module" src="app.js?v=2"></script>
</body>
</html>
