<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Radar</title>
<style>
  html,body{margin:0;height:100%;background:#0b1020;color:#e6e9f2;font-family:system-ui,sans-serif;overflow:hidden}
  #bar{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:8px;padding:10px;z-index:1}
  button{padding:10px 14px;border:0;border-radius:8px;background:#26335c;color:#fff;font-size:15px}
  button:disabled{opacity:.4}
  #status{position:fixed;bottom:0;left:0;right:0;padding:10px;font-size:14px}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="bar">
  <button id="connect">Connect radar</button>
  <button id="clear">Clear my map</button>
  <button id="restore">Show all</button>
  <button id="demo">Demo</button>
</div>
<div id="status">Starting...</div>
<script type="module" src="app.js"></script>
</body>
</html>
